name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  check-build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # js 后端要 Node 才能跑，先装好
      - name: 安装 Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: 安装 MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: MoonBit 版本
        run: moon version

      - name: 更新注册表索引
        run: moon update

      - name: 格式检查
        run: moon fmt --check

      - name: 检查
        run: moon check --target wasm-gc --deny-warn

      - name: 构建
        run: moon build --target wasm-gc

      - name: 测试
        run: moon test --target wasm-gc

      # 解码逻辑不依赖后端特性，js 后端应解出同样的结果
      - name: 测试（js 后端）
        run: moon test --target js

      - name: WASM 契约检查
        run: python3 tools/wasm_contract.py

      - name: WASM 运行时冒烟与产物新鲜度
        run: |
          moon build --target wasm-gc --release
          fresh=_build/wasm-gc/release/build/moonvorbis.wasm
          # demo/moonvorbis.wasm 是 Pages 演示真正加载的那份，不能落后于源码
          node tools/wasm_smoke.mjs "$RUNNER_TEMP/fresh.wav" "$fresh"
          node tools/wasm_smoke.mjs "$RUNNER_TEMP/committed.wav" demo/moonvorbis.wasm
          cmp "$RUNNER_TEMP/fresh.wav" "$RUNNER_TEMP/committed.wav"
          # wasm 与命令行共用同一套解码实现，解同一条流应逐字节相同
          moon run cmd/main --target wasm-gc -- demo/sample.ogg "$RUNNER_TEMP/cli.wav"
          cmp "$RUNNER_TEMP/fresh.wav" "$RUNNER_TEMP/cli.wav"

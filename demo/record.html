<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>moonvorbis — 演示录制页</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1b1f24;
        --muted: #5b6472;
        --line: #d6dbe3;
        --accent: #2f6feb;
        --bg: #ffffff;
        --panel: #f7f8fa;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #e6e9ef;
          --muted: #9aa4b2;
          --line: #333a45;
          --accent: #6ea8ff;
          --bg: #14171c;
          --panel: #1b1f26;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        padding: 2rem 1.25rem;
        font: 15px/1.6 system-ui, -apple-system, "Segoe UI", "Microsoft YaHei",
          sans-serif;
        color: var(--fg);
        background: var(--bg);
        display: flex;
        justify-content: center;
      }
      main {
        width: 100%;
        max-width: 640px;
      }
      h1 {
        font-size: 1.35rem;
        margin: 0 0 0.25rem;
      }
      .sub {
        color: var(--muted);
        margin: 0 0 1.5rem;
      }
      #drop {
        display: block;
        border: 2px dashed var(--line);
        border-radius: 10px;
        padding: 2rem 1rem;
        text-align: center;
        background: var(--panel);
        transition: border-color 0.15s, background 0.15s;
      }
      #drop.hover {
        border-color: var(--accent);
        background: color-mix(in srgb, var(--accent) 8%, var(--panel));
      }
      #drop strong {
        color: var(--accent);
      }
      #drop p {
        margin: 0.5rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
      }
      #status {
        margin: 1.25rem 0 0;
        min-height: 1.6em;
        font-size: 0.9375rem;
      }
      #result {
        display: none;
        margin-top: 1.25rem;
        padding-top: 1.25rem;
        border-top: 1px solid var(--line);
      }
      #result.show {
        display: block;
      }
      canvas {
        width: 100%;
        height: 150px;
        display: block;
        border-radius: 8px;
        background: var(--panel);
      }
      #meta {
        color: var(--muted);
        font-size: 0.875rem;
        margin: 0.75rem 0 0;
      }
      #bar {
        height: 3px;
        margin-top: 0.85rem;
        border-radius: 2px;
        background: var(--line);
        overflow: hidden;
        display: none;
      }
      #bar.show {
        display: block;
      }
      #bar span {
        display: block;
        height: 100%;
        width: 0;
        border-radius: 2px;
        background: var(--accent);
        transition: width 0.15s linear;
      }
      footer {
        margin-top: 1.75rem;
        padding-top: 1rem;
        border-top: 1px solid var(--line);
        color: var(--muted);
        font-size: 0.8125rem;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>moonvorbis</h1>
      <p class="sub">
        纯 MoonBit 实现的 OGG/Vorbis 解码器，编译为 WebAssembly，在浏览器内完成解码。
      </p>

      <label id="drop">
        <strong id="dropTitle">选择或拖入 .ogg 文件</strong>
        <p id="dropHint">音频不会上传到任何服务器，全部在本地解码</p>
      </label>

      <p id="status">正在加载解码器…</p>
      <div id="bar"><span></span></div>

      <section id="result">
        <canvas id="wave" width="1184" height="300"></canvas>
        <p id="meta"></p>
      </section>

      <footer>
        页面在本地完成解码，音频不会上传。源码与构建方式见
        <code>README.md</code>。
      </footer>
    </main>

    <script type="module" src="./record.js"></script>
  </body>
</html>
